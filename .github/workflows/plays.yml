name: plays

on:
  pull_request:
    paths: ['skills/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['skills/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-plays.mjs

